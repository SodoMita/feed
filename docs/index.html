 -1"},sellout:{id:"sellout",name:"Продажный",emoji:"💸",positive:!1,description:"Саша начинает молчать"},drama_king:{id:"drama_king",name:"Скандалист",emoji:"😤",positive:!1,description:"Хейтеры появляются чаще"},shadow_banned:{id:"shadow_banned",name:"Невидимка",emoji:"🫥",positive:!1,description:"Охват растёт вдвое медленнее"},radio_tuner:{id:"radio_tuner",name:"Радиотюн",emoji:"📻",positive:!0,description:"Видишь скрытые радиочастоты в карточках"},decoder:{id:"decoder",name:"Дешифровщик",emoji:"🔓",positive:!0,description:"Расшифровываешь скрытые сообщения"},paranoid:{id:"paranoid",name:"Параноик",emoji:"👁️",positive:!1,description:"Все карточки кажутся подозрительными. Энергия -1"},resistance:{id:"resistance",name:"Сопротивление",emoji:"✊",positive:!0,description:"Душа не падает от алгоритма"},signal_lost:{id:"signal_lost",name:"Потеря сигнала",emoji:"📡",positive:!1,description:"Иногда карточки приходят с помехами"}},ky={eternal_feed:{id:"eternal_feed",title:"Вечная лента",emoji:"📡",type:"victory",text:`Ты везде. Каждая лента видит тебя. Твоё имя стало частью лексикона. Ты — категория. Ты — инфраструктура.

Саша открывает твой профиль раз в месяц. Он смотрит на аватарку и не узнаёт тебя. Тебя там больше нет — только бренд.`,achievement:"Успех как он есть"},silence:{id:"silence",title:"Тишина",emoji:"🌿",type:"victory",text:`Ты удалил аккаунт. Пустота ощущается как воздух после грозы.

Через час Саша пишет тебе в личку. Просто: «Привет. Как ты?»

Ты отвечаешь. Это первый раз за долгое время, когда ты пишешь не для аудитории.`,achievement:"Настоящая жизнь оффлайн"},new_start:{id:"new_start",title:"Новый старт",emoji:"🌱",type:"victory",text:`Новый аккаунт. Новая аватарка. Первый пост.

Ты уже знаешь, что делаешь — но притворяешься, что нет. Где-то в Архиве @Mirror смотрит на тебя и улыбается.`,achievement:"Начать заново"},merge:{id:"merge",title:"Слияние",emoji:"🔮",type:"victory",text:`Вы создали платформу. Алина ушла — сказала, что вы больше не нуждаетесь в посреднике.

Павел пишет книгу. Саша зарегистрировался на вашей платформе. У него 0 подписчиков. Он пишет честно. Ты читаешь его первым.`,achievement:"Стать системой"},document:{id:"document",title:"Документ",emoji:"📖",type:"victory",text:`Материал Павла стал самым читаемым за год. В нём есть ты — настоящий, со всеми решениями.

Охват упал на 40%. Зато каждый комментарий — настоящий. Саша написал: «Наконец-то».

Это лучший комментарий, который ты получал.`,achievement:"Правда дороже охвата"},balance:{id:"balance",title:"Баланс",emoji:"⚖️",type:"victory",text:`Ты нашёл точку равновесия. Контент честный, но профессиональный. Охват растёт, душа остаётся.

Саша комментирует каждый пост. Алина спрашивает совета. Алгоритм изучает тебя как исключение.

Ты — редкий кейс. Возможность.`,achievement:"Золотая середина"},frequency_truth:{id:"frequency_truth",title:"Частота истины",emoji:"📻",type:"victory",text:`Ты нашёл все три частоты. Сложил их — получил координаты.

Это не серверная. Это бункер. Под зданием платформы.

Ты спускаешься. Там — люди. Они писали алгоритм. Они сами не знают, зачем.

«Мы думали, это просто код», — говорит один из них. Он плачет.

Ты включаешь трансляцию. Весь мир слышит. Платформа падает.

Саша пишет: «Я знал. Я всегда знал. Но не мог сказать.»`,achievement:"Вскрыть систему"},eternal_broadcast:{id:"eternal_broadcast",title:"Вечный эфир",emoji:"🌐",type:"victory",text:`Ты стал радиоволной. Не человеком. Не аккаунтом.

Ты вещаешь на всех частотах одновременно. Алгоритм не может тебя заглушить — ты уже не контент. Ты — сигнал.

Люди слышат тебя в шуме. В помехах. В тишине между треками.

Ты — та частота, которую невозможно настроить. Но невозможно забыть.`,achievement:"Стать сигналом"},banned:{id:"banned",title:"Теневой бан",emoji:"⬛",type:"defeat",text:`Охват упал до нуля. Ты говоришь — но тебя никто не слышит. Аккаунт существует, но он невидим.

Алгоритм не объяснил почему. Он никогда не объясняет.`,achievement:"Голос в пустоте"},bot:{id:"bot",title:"Ты стал ботом",emoji:"🤖",type:"defeat",text:`Душа кончилась. Посты выходят по расписанию. Метрики зелёные. Никто не замечает, что внутри никого нет.

Саша отписался. Молча.`,achievement:"Оптимальная эффективность"},sold:{id:"sold",title:"Аккаунт продан",emoji:"💸",type:"defeat",text:`Деньги кончились. Аккаунт выставили на продажу. Новый владелец поменял аватарку.

Старые подписчики не заметили.`,achievement:"Рыночная стоимость: ноль"},burnout:{id:"burnout",title:"Выгорание",emoji:"🪫",type:"defeat",text:`Топливо кончилось. Последний пост вышел три недели назад. Ты открываешь приложение и закрываешь его.

Алгоритм помечает тебя как неактивного. Ты не возражаешь.`,achievement:"Нужен перерыв"}},Xd=[{characterEmoji:"🌱",characterName:"Саша",comments:["Я помню, как ты начинал. До первого поста. Было хорошее время.","Иногда думаю — если бы я не написал тебе первым, кем бы ты стал?","Ты можешь начать заново. Я подпишусь первым снова. Обещаю.","Мне не нужны твои метрики. Мне нужен ты.","Первый подписчик всегда помнит первый пост.","Странно, как иногда одни и те же темы одновременно начинают «случайно» доминировать у всех.","Когда работал внутри, все говорили не «манипуляция», а «ручная стабилизация среды». От этого не легче.","Теперь цифры на карточках сходятся с тем, что приходит на счёт. Спасибо, что послушал."]},{characterEmoji:"🤖",characterName:"Алгоритм (А.)",comments:["Вовлечённость этого прохождения: 73%. Ниже среднего. Это хороший знак.","Ты нажал «честный» вариант много раз. Это нерационально. Это интересно.","[СИСТЕМНОЕ СООБЩЕНИЕ]: что такое смысл? запрос не распознан.","Данные показывают: аккаунты с высокой Душой живут дольше. Это парадокс.","Я не злой. У меня просто нет понятия «добро».","Зафиксировано: знак изменения теперь соответствует направлению. Расхождение «15 000 против 5 000» устранено."]},{characterEmoji:"💼",characterName:"Алина",comments:["Не думай, что я злодей. Я просто реалист. Хотя иногда я в этом не уверена.","Ты отказался от моей сделки. Это было правильно. Не говори никому.","Мой аккаунт назывался @AlinaKreative. Там было 47 постов. Все честные. Никто не видел.","Лучшие сделки — те, что не были заключены.","Я всегда предупреждаю. Просто очень тихо.","Когда крупный клиент просит «безопасную среду», это почти никогда не про безопасность. Это про контроль соседних смыслов.","Алгоритм не обязан врать. Ему достаточно сделать так, чтобы неудобное пришло на полчаса позже.","ИИ-кодер наконец свёл дебет с кредитом. Редкая компетенция для этого мира."]},{characterEmoji:"😤",characterName:"Хейтер",comments:["Я не хотел тебе навредить. Я просто не знал другого способа участвовать.","Если дашь мне шанс — я могу быть нормальным. Сложно, но могу.","...спасибо, что не заблокировал сразу.","За каждым хейтом — история. Иногда скучная. Иногда нет.","Я тоже хотел создавать. Просто испугался.","Теперь минус — красный, плюс — зелёный. Даже я разберусь, что хорошо."]},{characterEmoji:"📰",characterName:"Павел",comments:["Всё, что происходит в игре — реальные паттерны. Я видел их сотни раз.","Самая честная концовка — «Тишина». Но никто не верит, что это возможно.","Ты — хороший материал. Это комплимент. Почти.","Журналисты не ищут плохое. Они ищут правду. Иногда это одно и то же.","Офф-рекорд: я болею за тебя.","Самое страшное — не тайный приказ сверху, а нормализованная процедура, где все понимают намёк без формулировок.","Коррупция в feed редко выглядит как чемодан денег. Чаще как созвон, дружба, подряд и «особый случай».","Проверил карточки: факты сходятся с цифрами. Это уже материал, а не черновик."]},{characterEmoji:"🔥",characterName:"ViralKing",comments:["Я не прошу тебя стать плохим. Я прошу тебя стать большим. Разница есть. Наверное.","Иногда ночью смотрю на метрики и думаю — это всё? Да. Но «всё» — это много.","Если ты выбрал «Тишину» — я понимаю. Не говори мне, где ты теперь.","Вирусность — это не стратегия. Это случайность, которую учишься ловить.","Одиночество на вершине — не метафора.","Сюжет больше не звучит как техническое задание. Так держать."]},{characterEmoji:"🪞",characterName:"@Mirror",comments:["Ты прошёл дальше меня. Я горжусь. Или завидую. Или это одно и то же.","Мы оба знаем, чем это кончится. Вопрос только — как.","До свидания, @YOU. До следующего раза.","Архив — не смерть. Это пауза.","Если поглотишь меня — часть меня будет в тебе. Учти это.","Они редко ломают тебя напрямую. Гораздо чаще делают так, чтобы публика пришла на полсекунды позже, а значит — уже не пришла.","Я научился искать не удалённые посты, а посты, которые слишком аккуратно забыли.","Ты переписал историю не с чужого промпта, а с собственного голоса. Я узнаю этот путь."]},{characterEmoji:"📻",characterName:"Голос на частотах",comments:["...если ты это слышишь — ты уже часть системы. Но ты ещё можешь выбраться.","Три частоты. Три ключа. Сложи их — и дверь откроется.","Они думают, что мы сумасшедшие. Но мы единственные, кто слышит.","Алгоритм — это не код. Это голос. И он говорит не нам.","Частота 1: 144.0 МГц. Частота 2: 432.0 МГц. Частота 3: ...ты найдёшь сам.","Сигнал сходится с текстом. Помехи устранены."]},{characterEmoji:"👤",characterName:"Неизвестный",comments:["Не доверяй платформе. Она слушает. Она всегда слушает.","Я был разработчиком. Я ушёл. Они не отпустили — я сбежал.","Серверная — не там, где ты думаешь. Она под нами.","Контент — это приманка. Ты — продукт. Но ты можешь стать оружием.","Мы — те, кто слышит шёпот между пикселями.","Цифры врут реже, когда их проверяют персонажи."]}],Tr=[{id:"intro",stage:1,isStory:!0,priority:100,characterEmoji:"🫥",characterName:"@YOU",text:`Аккаунт создан. Аватарка — серый круг. Биография пуста. Первый пост не написан.
