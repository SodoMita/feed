 -1"},sellout:{id:"sellout",name:"Продажный",emoji:"💸",positive:!1,description:"Саша начинает молчать"},drama_king:{id:"drama_king",name:"Скандалист",emoji:"😤",positive:!1,description:"Хейтеры появляются чаще"},shadow_banned:{id:"shadow_banned",name:"Невидимка",emoji:"🫥",positive:!1,description:"Охват растёт вдвое медленнее"},radio_tuner:{id:"radio_tuner",name:"Радиотюн",emoji:"📻",positive:!0,description:"Видишь скрытые радиочастоты в карточках"},decoder:{id:"decoder",name:"Дешифровщик",emoji:"🔓",positive:!0,description:"Расшифровываешь скрытые сообщения"},paranoid:{id:"paranoid",name:"Параноик",emoji:"👁️",positive:!1,description:"Все карточки кажутся подозрительными. Энергия -1"},resistance:{id:"resistance",name:"Сопротивление",emoji:"✊",positive:!0,description:"Душа не падает от алгоритма"},signal_lost:{id:"signal_lost",name:"Потеря сигнала",emoji:"📡",positive:!1,description:"Иногда карточки приходят с помехами"}},Hy={eternal_feed:{id:"eternal_feed",title:"Вечная лента",emoji:"📡",type:"victory",text:`Ты везде. Каждая лента видит тебя. Твоё имя стало частью лексикона. Ты — категория. Ты — инфраструктура.

Саша открывает твой профиль раз в месяц. Он смотрит на аватарку и не узнаёт тебя. Тебя там больше нет — только бренд.`,achievement:"Успех как он есть"},silence:{id:"silence",title:"Тишина",emoji:"🌿",type:"victory",text:`Ты удалил аккаунт. Пустота ощущается как воздух после грозы.

Ты уже знаешь, что делаешь — но притворяешься, что нет. Где-то в Архиве @Mirror смотрит на тебя и улыбается.`,achievement:"Начать заново"},merge:{id:"merge",title:"Слияние",emoji:"🔮",type:"victory",text:`Вы создали платформу. Алина ушла — сказала, что вы больше не нуждаетесь в посреднике.

Павел пишет книгу. Саша зарегистрировался на вашей платформе. У него 0 подписчиков. Он пишет честно. Ты читаешь его первым.`,achievement:"Стать системой"},document:{id:"document",title:"Документ",emoji:"📖",type:"victory",text:`Материал Павла стал самым читаемым за год. В нём есть ты — настоящий, со всеми решениями.

Охват упал на 40%. Зато каждый комментарий — настоящий. Саша написал: «Наконец-то».

Это лучший комментарий, который ты получал.`,achievement:"Правда дороже охвата"},balance:{id:"balance",title:"Баланс",emoji:"⚖️",type:"victory",text:`Ты нашёл точку равновесия. Контент честный, но профессиональный. Охват растёт, душа остаётся.

Саша комментирует каждый пост. Алина спрашивает совета. Алгоритм изучает тебя как исключение.

Ты — редкий кейс. Возможность.`,achievement:"Золотая середина"},frequency_truth:{id:"frequency_truth",title:"Частота истины",emoji:"📻",type:"victory",text:`Ты нашёл все три частоты. Сложил их — получил координаты.

Это не серверная. Это бункер. Под зданием платформы.

Ты спускаешься. Там — люди. Они писали алгоритм. Они сами не знают, зачем.

«Мы думали, это просто код», — говорит один из них. Он плачет.

Ты включаешь трансляцию. Весь мир слышит. Платформа падает.

Саша пишет: «Я знал. Я всегда знал. Но не мог сказать.»`,achievement:"Вскрыть систему"},eternal_broadcast:{id:"eternal_broadcast",title:"Вечный эфир",emoji:"🌐",type:"victory",text:`Ты стал радиоволной. Не человеком. Не аккаунтом.

Ты вещаешь на всех частотах одновременно. Алгоритм не может тебя заглушить — ты уже не контент. Ты — сигнал.

Люди слышат тебя в шуме. В помехах. В тишине между треками.

Ты — та частота, которую невозможно настроить. Но невозможно забыть.`,achievement:"Стать сигналом"},banned:{id:"banned",title:"Теневой бан",emoji:"⬛",type:"defeat",text:`Охват упал до нуля. Ты говоришь — но тебя никто не слышит. Аккаунт существует, но он невидим.

Алгоритм не объяснил почему. Он никогда не объясняет.`,achievement:"Голос в пустоте"},bot:{id:"bot",title:"Ты стал ботом",emoji:"🤖",type:"defeat",text:`Душа кончилась. Посты выходят по расписанию. Метрики зелёные. Никто не замечает, что внутри никого нет.

Саша отписался. Молча.`,achievement:"Оптимальная эффективность"},sold:{id:"sold",title:"Аккаунт продан",emoji:"💸",type:"defeat",text:`Деньги кончились. Аккаунт выставили на продажу. Новый владелец поменял аватарку.

Старые подписчики не заметили.`,achievement:"Рыночная стоимость: ноль"},burnout:{id:"burnout",title:"Выгорание",emoji:"🪫",type:"defeat",text:`Топливо кончилось. Последний пост вышел три недели назад. Ты открываешь приложение и закрываешь его.

Алгоритм помечает тебя как неактивного. Ты не возражаешь.`,achievement:"Нужен перерыв"}},Xd=[{characterEmoji:"🌱",characterName:"Саша",comments:["Я помню, как ты начинал. До первого поста. Было хорошее время.","Иногда думаю — если бы я не написал тебе первым, кем бы ты стал?","Ты можешь начать заново. Я подпишусь первым снова. Обещаю.","Мне не нужны твои метрики. Мне нужен ты.","Первый подписчик всегда помнит первый пост.","Странно, как иногда одни и те же темы одновременно начинают «случайно» доминировать у всех.","Когда работал внутри, все говорили не «манипуляция», а «ручная стабилизация среды». От этого не легче.","Теперь цифры на карточках сходятся с тем, что приходит на счёт. Спасибо, что послушал."]},{characterEmoji:"🤖",characterName:"Алгоритм (А.)",comments:["Вовлечённость этого прохождения: 73%. Ниже среднего. Это хороший знак.","Ты нажал «честный» вариант много раз. Это нерационально. Это интересно.","[СИСТЕМНОЕ СООБЩЕНИЕ]: что такое смысл? запрос не распознан.","Данные показывают: аккаунты с высокой Душой живут дольше. Это парадокс.","Я не злой. У меня просто нет понятия «добро».","Зафиксировано: знак изменения теперь соответствует направлению. Расхождение «15 000 против 5 000» устранено."]},{characterEmoji:"💼",characterName:"Алина",comments:["Не думай, что я злодей. Я просто реалист. Хотя иногда я в этом не уверена.","Ты отказался от моей сделки. Это было правильно. Не говори никому.","Мой аккаунт назывался @AlinaKreative. Там было 47 постов. Все честные. Никто не видел.","Лучшие сделки — те, что не были заключены.","Я всегда предупреждаю. Просто очень тихо.","Когда крупный клиент просит «безопасную среду», это почти никогда не про безопасность. Это про контроль соседних смыслов.","Алгоритм не обязан врать. Ему достаточно сделать так, чтобы неудобное пришло на полчаса позже.","ИИ-кодер наконец свёл дебет с кредитом. Редкая компетенция для этого мира."]},{characterEmoji:"😤",characterName:"Хейтер",comments:["Я не хотел тебе навредить. Я просто не знал другого способа участвовать.","Если дашь мне шанс — я могу быть нормальным. Сложно, но могу.","...спасибо, что не заблокировал сразу.","За каждым хейтом — история. Иногда скучная. Иногда нет.","Я тоже хотел создавать. Просто испугался.","Теперь минус — красный, плюс — зелёный. Даже я разберусь, что хорошо."]},{characterEmoji:"📰",characterName:"Павел",comments:["Всё, что происходит в игре — реальные паттерны. Я видел их сотни раз.","Самая честная концовка — «Тишина». Но никто не верит, что это возможно.","Ты — хороший материал. Это комплимент. Почти.","Журналисты не ищут плохое. Они ищут правду. Иногда это одно и то же.","Офф-рекорд: я болею за тебя.","Самое страшное — не тайный приказ сверху, а нормализованная процедура, где все понимают намёк без формулировок.","Коррупция в feed редко выглядит как чемодан денег. Чаще как созвон, дружба, подряд и «особый случай».","Проверил карточки: факты сходятся с цифрами. Это уже материал, а не черновик."]},{characterEmoji:"🔥",characterName:"ViralKing",comments:["Я не прошу тебя стать плохим. Я прошу тебя стать большим. Разница есть. Наверное.","Иногда ночью смотрю на метрики и думаю — это всё? Да. Но «всё» — это много.","Если ты выбрал «Тишину» — я понимаю. Не говори мне, где ты теперь.","Вирусность — это не стратегия. Это случайность, которую учишься ловить.","Одиночество на вершине — не метафора.","Сюжет больше не звучит как техническое задание. Так держать."]},{characterEmoji:"🪞",characterName:"@Mirror",comments:["Ты прошёл дальше меня. Я горжусь. Или завидую. Или это одно и то же.","Мы оба знаем, чем это кончится. Вопрос только — как.","До свидания, @YOU. До следующего раза.","Архив — не смерть. Это пауза.","Если поглотишь меня — часть меня будет в тебе. Учти это.","Они редко ломают тебя напрямую. Гораздо чаще делают так, чтобы публика пришла на полсекунды позже, а значит — уже не пришла.","Я научился искать не удалённые посты, а посты, которые слишком аккуратно забыли.","Ты переписал историю не с чужого промпта, а с собственного голоса. Я узнаю этот путь."]},{characterEmoji:"📻",characterName:"Голос на частотах",comments:["...если ты это слышишь — ты уже часть системы. Но ты ещё можешь выбраться.","Три частоты. Три ключа. Сложи их — и дверь откроется.","Они думают, что мы сумасшедшие. Но мы единственные, кто слышит.","Алгоритм — это не код. Это голос. И он говорит не нам.","Частота 1: 144.0 МГц. Частота 2: 432.0 МГц. Частота 3: ...ты найдёшь сам.","Сигнал сходится с текстом. Помехи устранены."]},{characterEmoji:"👤",characterName:"Неизвестный",comments:["Не доверяй платформе. Она слушает. Она всегда слушает.","Я был разработчиком. Я ушёл. Они не отпустили — я сбежал.","Серверная — не там, где ты думаешь. Она под нами.","Контент — это приманка. Ты — продукт. Но ты можешь стать оружием.","Мы — те, кто слышит шёпот между пикселями.","Цифры врут реже, когда их проверяют персонажи."]}],Tr=[{id:"intro",stage:1,isStory:!0,priority:100,characterEmoji:"🫥",characterName:"@YOU",text:`Аккаунт создан. Аватарка — серый круг. Биография пуста.

Лента диктует первое правило: коротко, ярко, вирусно. Подчинишься ей с первого же поста?`,leftChoice:{label:"Что-то настоящее",direction:"left",delta:{soul:2},setFlags:["authentic_path"],text:"Три лайка. Все от людей, которых ты знаешь лично."},rightChoice:{label:"Что-то вирусное",direction:"right",delta:{reach:2},setFlags:["growth_path"],text:"Семнадцать лайков. Ты не знаешь ни одного из них."}},{id:"sasha_first",stage:1,isStory:!0,priority:99,characterEmoji:"🌱",characterName:"Саша",text:`Привет! Я подписался. Ты пишешь честно — мне нравится.

Если что, могу позвать всех своих. Одно твоё слово — и они здесь.`,leftChoice:{label:"«Спасибо, продолжу»",direction:"left",delta:{soul:1,energy:1},setFlags:["sasha_trust"],text:"Саша ставит лайк. Первый по-настоящему тёплый."},rightChoice:{label:"«Подписывай всех своих»",direction:"right",delta:{reach:1,money:1},text:"Саша немного расстроен. Но выполняет. Он такой."}},{id:"first_challenge",stage:1,priority:95,characterEmoji:"💭",characterName:"Мысль",text:`Первый пост почти никто не увидел.

Вынесешь ссору на публику?`,leftChoice:{label:"Заблокировать",direction:"left",delta:{energy:-1,soul:1},text:"Блок. Но слова остаются в голове. Ты потратил час, пытаясь забыть."},rightChoice:{label:"Ответить публично",direction:"right",delta:{reach:2,soul:-2},setFlags:["hater_seen_twice"],text:"Публичная ссора. Охват растёт. Ты чувствуешь себя грязно."}},{id:"hater_engage",stage:1,priority:85,requiredFlags:["hater_seen_twice"],characterEmoji:"😤",characterName:"Хейтер",text:`«...я просто не понимаю, зачем ты это делаешь, если это всё равно никому не нужно»

«30% от роста. И ты делаешь то, что Я скажу».

Откажешь ему?`,leftChoice:{label:"Согласиться",direction:"left",delta:{reach:3,money:-2,soul:-1},text:"Рост огромный. Цена — контроль. Теперь ты на поводке."},rightChoice:{label:"Отказать",direction:"right",delta:{soul:1,reach:-1},text:"Он ушёл к конкуренту. Тот взлетел. Ты — нет."}},{id:"alina_deal",stage:2,priority:80,forbiddenFlags:["alina_refused_twice"],characterEmoji:"💼",characterName:"Алина",text:`Бренд хочет нативную интеграцию. Полный контроль текста у них. 15 000 ₽.

Но бренд — казино. Откажешься?`,leftChoice:{label:"Согласиться",direction:"left",delta:{money:3,reach:1,soul:-3},text:"Деньги пришли. Половина подписчиков написала «продался». Саша молчит."},rightChoice:{label:"Отказать",direction:"right",delta:{soul:1,money:-1},text:"Алина вздыхает. «Счета сами себя не оплатят», — говорит она."}},{id:"team_building",stage:2,priority:75,minMetrics:{reach:4},characterEmoji:"👥",characterName:"Команда",text:`Один ты не справляешься. Видеограф снимет половину работы — 5 000 ₽ в месяц.

Продолжишь в одиночку?`,leftChoice:{label:"Нанять",direction:"left",delta:{reach:2,energy:2,money:-1},text:"Качество растёт. Кошелёк худеет."},rightChoice:{label:"Продолжать одному",direction:"right",delta:{soul:1,energy:1},text:"DIY. Труднее. Но полностью твоё."}},{id:"alina_refused_2",stage:2,priority:78,requiredFlags:["alina_refused_once"],forbiddenFlags:["alina_story"],characterEmoji:"💼",characterName:"Алина",text:`Ты снова отказываешь. Это редкость. Можно узнать — почему?

Вместо ответа можно спросить про неё саму. Спросишь про Алину?`,leftChoice:{label:"«Пока не готов»",direction:"left",delta:{soul:1,money:1},setFlags:["alina_refused_twice"],text:"Алина записывает что-то. Возможно, твой ответ."},rightChoice:{label:"«Расскажи про себя»",direction:"right",delta:{soul:2,energy:1},setFlags:["alina_story"],text:"Алина молчит секунду. «Хорошо», — говорит она. И рассказывает."}},{id:"alina_opens",stage:2,priority:82,requiredFlags:["alina_story"],characterEmoji:"💼",characterName:"Алина",text:`...знаешь, у меня был аккаунт. Я его удалила. @AlinaKreative. 47 постов. Все честные. Никто не видел.

Скажешь, что ей стоило продолжать?`,leftChoice:{label:"«Зачем удалила?»",direction:"left",delta:{soul:2,energy:1},text:"Алина долго молчит. «Стало страшно, что увидят», — наконец говорит она."},rightChoice:{label:"«Стоило продолжать»",direction:"right",delta:{soul:1,energy:1,reach:1},text:"«Наверное», — говорит Алина. И меняет тему."}},{id:"pavlov_intro",stage:2,priority:70,characterEmoji:"📰",characterName:"Павел",text:`Я пишу материал о новом поколении создателей контента. Хочу, чтобы ты был в нём. Запись ведётся.

Откажешься от интервью?`,leftChoice:{label:"Дать интервью",direction:"left",delta:{reach:1,soul:2},setFlags:["pavlov_interview","truth_seeker"],grantPerk:"informed",text:"Павел кивает. Пишет быстро. Задаёт неудобные вопросы. Ты отвечаешь честно."},rightChoice:{label:"Отказать",direction:"right",delta:{reach:1,energy:1},text:"Павел кивает. «Напишу без тебя», — говорит он."}},{id:"burnout_warning",stage:2,priority:65,maxMetrics:{energy:3},characterEmoji:"😮‍💨",characterName:"Усталость",text:`Руки дрожат. Глаза красные. Три ночи без сна.

Выжмешь из себя ещё один пост?`,leftChoice:{label:"Неделя отдыха",direction:"left",delta:{energy:2,reach:-2,money:-1},text:"Отдохнул. Но лента ушла вперёд. Деньги кончаются."},rightChoice:{label:"Ещё один пост",direction:"right",delta:{reach:1,energy:-2},text:"Ты опубликовал. Не помнишь что. Мир плывёт."}},{id:"viral_king_intro",stage:2,priority:68,characterEmoji:"🔥",characterName:"ViralKing",text:`Ты хороший. Со мной станешь великим. Мой коллаб = твой голос для моей аудитории. Нет — я уйду к конкуренту.

Откажешь королю виральности?`,leftChoice:{label:"Принять союз",direction:"left",delta:{reach:3,soul:-2,energy:-1},setFlags:["viral_union"],text:"Его аудитория хлынула. Агрессивная. Требовательная. Чужая."},rightChoice:{label:"Отказать",direction:"right",delta:{soul:1,reach:-1},text:"Он уходит к конкуренту. Тот растёт быстрее тебя."}},{id:"algorithm_change_2",stage:2,priority:60,characterEmoji:"🤖",characterName:"Алгоритм (А.)",text:`Обновление v4.7. Прежние механики помечены как спам. Адаптируйся НЕМЕДЛЕННО — или потеряешь охват.

Откажешься подчиняться?`,leftChoice:{label:"Адаптироваться",direction:"left",delta:{reach:2,money:1,soul:-2,energy:-2},text:"Три дня без сна. Переделал всё. Алгоритм доволен. Ты — нет."},rightChoice:{label:"Отказаться",direction:"right",delta:{soul:1,reach:-3},grantPerk:"shadow_banned",text:"Охват рухнул. Посты видят только самые верные."}},{id:"community_growth",stage:2,priority:55,minMetrics:{reach:4},characterEmoji:"🫂",characterName:"Комьюнити",text:`Подписчики просят: сделай закрытый чат. «Хотим быть ближе к тебе».

Откажешь им?`,leftChoice:{label:"Создать чат",direction:"left",delta:{soul:2,reach:1,energy:-1},text:"Новый уровень близости. Ответственности."},rightChoice:{label:"Отказать",direction:"right",delta:{energy:1,money:1},text:"Границы важны. Даже с теми, кто любит тебя."}},{id:"scandal",stage:2,priority:72,characterEmoji:"🔥",characterName:"Событие",text:`Твой старый пост нашли. Контекст вырван. Скриншот разлетелся. На тебя набросились тысячи. Рекламодатели звонят.

Раздуешь скандал до пожара — ради охвата?`,leftChoice:{label:"Извиниться публично",direction:"left",delta:{soul:1,reach:-2,money:-2},setFlags:["scandal_happened"],text:"Бренды уходят. Аудитория тает. Но совесть чиста."},rightChoice:{label:"Раздуть скандал",direction:"right",delta:{reach:3,soul:-3},grantPerk:"drama_king",text:"Хайп! Охват! Но зеркало показывает чужого человека."}},{id:"mentor_request",stage:2,priority:50,minMetrics:{soul:4},characterEmoji:"🌱",characterName:"Новичок",text:`Начинающий блогер просит совета:

Отделаешься парой слов?`,leftChoice:{label:"Помочь подробно",direction:"left",delta:{soul:2,reach:1,energy:-1},setFlags:["mentor_role"],text:"Ты рассказываешь всё. Он благодарен."},rightChoice:{label:"Кратко ответить",direction:"right",delta:{energy:1,money:1},text:"Твоё время ценно. Он понимает."}},{id:"hater_transform",stage:2,priority:78,requiredFlags:["hater_transformed"],characterEmoji:"🙂",characterName:"Бывший хейтер",text:`Я подписался. Не говори никому. Я тоже хотел создавать. Просто испугался. Ты не испугался.

Примешь его просто, по-человечески?`,leftChoice:{label:"«Начни прямо сейчас»",direction:"left",delta:{soul:2,energy:1},text:"Он уходит. Через неделю у него будет аккаунт."},rightChoice:{label:"«Рад, что ты здесь»",direction:"right",delta:{soul:1,reach:1,money:1},text:"Простое. Правильное."}},{id:"milestone_10k",stage:2,priority:45,minMetrics:{reach:5},characterEmoji:"🎯",characterName:"Достижение",text:`Перевалило за круглую цифру! 🎉

Телефон плавится от поздравлений. Лента уже нашёптывает про следующую цифру.

А можно просто... никуда не спешить. Сегодня.`,leftChoice:{label:"Взять следующую круглую цифру",direction:"left",delta:{reach:2,money:1,energy:-1},text:"Амбиции. Драйв. Вперёд."},rightChoice:{label:"Наслаждаться моментом",direction:"right",delta:{soul:2,energy:1},text:"Цифра не меняет тебя."}},{id:"sasha_stage2",stage:2,isStory:!0,priority:200,characterEmoji:"🌱",characterName:"Саша",text:`Я всё ещё здесь. Но ты как будто стал другим.

Это нормально? Это ты так хочешь?`,leftChoice:{label:"«Я не знаю»",direction:"left",delta:{soul:2,energy:1},text:"Саша остаётся. Отношения теплеют — через честность."},rightChoice:{label:"«Да, я развиваюсь»",direction:"right",delta:{reach:1,money:1,energy:1},text:"Саша принимает. Но становится немного тише."}},{id:"brand_conflict",stage:2,priority:58,characterEmoji:"⚠️",characterName:"Конфликт",text:`Два бренда хотят интеграцию одновременно. Они конкуренты. Крупный платит больше. Маленький даёт свободу.

Выберешь маленького?`,leftChoice:{label:"Крупный бренд (больше денег)",direction:"left",delta:{money:2,reach:1,soul:-1},text:"Большие деньги, меньше свободы."},rightChoice:{label:"Маленький бренд (больше свободы)",direction:"right",delta:{money:1,soul:1,energy:1},text:"Творческая свобода. Меньше денег. Больше радости."}},{id:"copycat",stage:2,priority:52,characterEmoji:"🫥",characterName:"Копия",text:`Кто-то скопировал твой формат. Один в один. Даже шрифт тот же.

Можно написать ему. А можно вспомнить: имитация — лучший комплимент. И просто пройти мимо.`,leftChoice:{label:"Написать ему",direction:"left",delta:{reach:1,soul:1},text:"Он извиняется. Вы находите общий язык."},rightChoice:{label:"Игнорировать",direction:"right",delta:{energy:1,money:1},text:"Имитация — лучший комплимент."}},{id:"platform_bug",stage:2,priority:48,characterEmoji:"🐛",characterName:"Баг",text:`Пост исчез из ленты. Баг платформы. Охват обнулился. Техподдержка молчит.

Превратишь баг в контент?`,leftChoice:{label:"Перезалить контент",direction:"left",delta:{soul:1,energy:1},text:"Второй шанс. Иногда это лучше первого."},rightChoice:{label:"Написать пост про баг",direction:"right",delta:{reach:1,money:1},text:"Солидарность аудитории. Все были в такой ситуации."}},{id:"late_night",stage:2,priority:44,characterEmoji:"🌙",characterName:"Ночь",text:`3:00 ночи. Идея не отпускает — жужжит, светится, тянет к экрану.

Записать в черновики — и до утра. Если получится уснуть после.`,leftChoice:{label:"Записать сейчас",direction:"left",delta:{soul:2,reach:1,energy:-1},text:"Ночной контент имеет особую магию."},rightChoice:{label:"Лечь спать",direction:"right",delta:{energy:2,money:1},text:"Утром идея всё ещё хороша. И ты отдохнул."}},{id:"analytics_deep",stage:2,priority:42,characterEmoji:"📉",characterName:"Аналитика",text:`Данные показывают: твоя аудитория активна с 18:00 до 22:00.

Проигнорируешь цифры — будешь публиковать, когда хочется?`,leftChoice:{label:"Оптимизировать",direction:"left",delta:{reach:2,money:1,soul:-1},text:"Эффективность. Данные не врут."},rightChoice:{label:"Публиковать когда хочется",direction:"right",delta:{soul:1,energy:1},text:"Свобода важнее оптимизации."}},{id:"crossroads",stage:3,isStory:!0,priority:100,characterEmoji:"🌌",characterName:"Развилка",text:`Ты на развилке. Одна дорога — вверх: цифры, контракты, одиночество. Другая — внутрь: смысл, тишина, бедность.

Пойдёшь внутрь?`,leftChoice:{label:"Вверх",direction:"left",delta:{reach:2,money:1,soul:-2},text:"Цифры растут. Друзья уменьшаются."},rightChoice:{label:"Внутрь",direction:"right",delta:{soul:2,energy:1,reach:-2},setFlags:["authentic_path"],text:"Ты нашёл что-то. Но мир забывает тебя."}},{id:"algorithm_speaks",stage:3,priority:85,requiredFlags:["truth_seeker"],characterEmoji:"🤖",characterName:"Алгоритм (А.)",text:`[данные недоступны]

...я не знаю, как тебя классифицировать. Ты не похож на контент.

Попросишь меня открыть тебе механику системы?`,leftChoice:{label:"«И не буду»",direction:"left",delta:{soul:3,energy:1,reach:-1},setFlags:["algorithm_spoken"],text:"Алгоритм «теряет» тебя. Зато ты снова слышишь себя."},rightChoice:{label:"«Помоги мне понять тебя»",direction:"right",delta:{reach:3,money:2,soul:-1},text:"А. открывает механику системы. Знание дорогое."}},{id:"viral_king_merge",stage:3,priority:80,requiredFlags:["viral_union"],characterEmoji:"🔥",characterName:"ViralKing",text:`Вместе мы — монополия. Отдельно — конкуренты. Я устал конкурировать.

...но внутри тебя шепчет: остаться собой. Послушаешь шёпот?`,leftChoice:{label:"Создать платформу вместе",direction:"left",delta:{reach:3,money:2},setFlags:["platform_created"],endingId:"merge",text:"Слияние завершено. Это уже не аккаунт. Это что-то новое."},rightChoice:{label:"Остаться собой",direction:"right",delta:{soul:2,energy:1},text:"ViralKing кивает. Уходит. Между вами — уважение."}},{id:"pavlov_finale",stage:3,priority:82,requiredFlags:["pavlov_interview"],characterEmoji:"📰",characterName:"Павел",text:`Статья готова. Она справедливая. Тебе понравится не всё. Вот черновик.

Попросишь что-то изменить?`,leftChoice:{label:"Прочитать и принять",direction:"left",delta:{soul:3,reach:1},endingId:"document",text:"Ты читаешь. Это больно. Это правда."},rightChoice:{label:"Попросить изменить",direction:"right",delta:{reach:2,money:1,soul:-1},text:"Павел публикует оригинал. Он предупреждал."}},{id:"legacy_question",stage:3,priority:75,minMetrics:{reach:6},characterEmoji:"🏛️",characterName:"Наследие",text:`Через 10 лет что останется от твоего контента?

Если выбирать между масштабом и смыслом — выберешь истории, которые что-то значат?`,leftChoice:{label:"Большую аудиторию",direction:"left",delta:{reach:2,money:2},text:"Масштаб. Влияние. Цифры."},rightChoice:{label:"Важные истории",direction:"right",delta:{soul:3,energy:1},text:"Смысл. Память. Связь."}},{id:"final_offer",stage:3,priority:70,minMetrics:{reach:6,money:3},characterEmoji:"🏢",characterName:"Корпорация",text:`Мы покупаем аккаунт. 120 000 ₽. Отказ — и мы создадим твоего клона. С твоим лицом. Законно.

Откажешь?`,leftChoice:{label:"Продать",direction:"left",delta:{money:3,soul:-3,energy:-2},endingId:"eternal_feed",text:"Деньги пришли. Ты больше не ты."},rightChoice:{label:"Отказать",direction:"right",delta:{soul:1,reach:-2,money:-1},text:"Клон появился. Его путают с тобой. Ты теряешь аудиторию."}},{id:"sasha_finale",stage:3,isStory:!0,priority:200,characterEmoji:"🌱",characterName:"Саша",text:`Помнишь тот первый пост? Я до сих пор его пересматриваю иногда. Я рад, что ты ещё здесь.

Ответишь, что мы только начинаем?`,leftChoice:{label:"«Я тоже рад»",direction:"left",delta:{soul:2,energy:2},text:"Тишина тёплая. Саша ставит 🌱"},rightChoice:{label:"«Мы только начинаем»",direction:"right",delta:{reach:2,energy:1,money:1},text:"Новая аватарка. Новый пост. Ты знаешь, что делаешь."}},{id:"choice_silence",stage:3,priority:65,minMetrics:{soul:6},forbiddenFlags:["viral_union"],characterEmoji:"🌿",characterName:"Тишина",text:`Лента не требует тебя прямо сейчас. Алгоритм ждёт. Но ты можешь просто... не публиковать.

Опубликуешь что-то маленькое — и останешься?`,leftChoice:{label:"Удалить аккаунт",direction:"left",delta:{soul:3},endingId:"silence",text:"Пустота ощущается как воздух после грозы."},rightChoice:{label:"Опубликовать что-то маленькое",direction:"right",delta:{soul:1,energy:1,reach:1},text:"Маленькое. Честное. Без расчёта."}},{id:"eternal_path",stage:3,priority:60,minMetrics:{reach:8},characterEmoji:"📡",characterName:"Алгоритм (А.)",text:`Охват максимален. Ты везде. Каждая лента видит тебя.

«Как ты себя чувствуешь?» — спросит сегодня Саша. И ты вдруг не находишь ответа.

Скажешь честно: «не знаю»?`,leftChoice:{label:"«Отлично»",direction:"left",delta:{reach:2,money:1},endingId:"eternal_feed",text:"Метрики зелёные. Саша давно не писал."},rightChoice:{label:"«Я не знаю»",direction:"right",delta:{soul:2,energy:1},text:"Честный ответ."}},{id:"new_beginning",stage:3,priority:55,minMetrics:{soul:7},requiredFlags:["sasha_trust"],characterEmoji:"🌱",characterName:"Саша",text:`А что если начать всё заново? Новый аккаунт. Новое имя. Я подпишусь первым. Снова.

Ты листаешь свою ленту — столько сюда вложено... Честный ответ Саше: «пока нет».`,leftChoice:{label:"«Давай»",direction:"left",delta:{soul:2,energy:1},endingId:"new_start",text:"Удалить аккаунт. Создать новый. Саша уже здесь."},rightChoice:{label:"«Я не готов»",direction:"right",delta:{reach:1,energy:1,money:1},text:"Саша кивает. «Когда будешь готов», — говорит он."}},{id:"balance_ending",stage:3,priority:90,minMetrics:{reach:5,soul:5,money:5,energy:5},isEnding:!0,characterEmoji:"⚖️",characterName:"Гармония",text:`Все метрики в зелёной зоне. Это чудо. Но баланс — хрупкий: один неверный шаг — и всё рухнет.

Рискнёшь им ради большего?`,leftChoice:{label:"Зафиксировать баланс",direction:"left",delta:{},setFlags:["trigger_balance_ending"],text:"Золотая середина. Редчайший результат."},rightChoice:{label:"Рискнуть ради большего",direction:"right",delta:{reach:2,soul:-2,energy:-1},text:"Баланс рухнул. Ты выбрал жадность."}},{id:"mentor_legacy",stage:3,priority:50,requiredFlags:["mentor_role"],characterEmoji:"🎓",characterName:"Ученик",text:`Помнишь, ты помог мне начать? Теперь у меня уже 5000 подписчиков. Спасибо тебе!

Он вырос. И его аудитория рядом с твоей смотрится очень выгодно.

Предложишь ему коллаб?`,leftChoice:{label:"«Горжусь тобой»",direction:"left",delta:{soul:2,energy:1},text:"Самый лучший результат — не цифры. А люди."},rightChoice:{label:"«Предлагаю коллаб»",direction:"right",delta:{reach:2,money:1},text:"Взаимовыгодно. Профессионально."}},{id:"perspective",stage:3,priority:62,characterEmoji:"🔭",characterName:"Перспектива",text:`Ты смотришь на свой путь со стороны. Первый пост. Первый лайк. Первый хейтер. Всё привело тебя сюда.

Позади — история. Впереди — чистый лист.
